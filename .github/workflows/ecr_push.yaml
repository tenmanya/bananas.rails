name: Push Image to ECR

on:
  workflow_call:
    outputs:
      image_tag:
        description: 'The full image tag that was pushed to ECR'
        value: ${{ jobs.push_image.outputs.image_tag }}
    inputs:
      commit_sha:
        description: 'Commit SHA to use as the image tag'
        required: true
        type: string
      github_environment:
        description: 'GitHub environment to publish to'
        required: true
        type: string
      aws_iam_role_arn:
        description: 'AWS IAM role ARN to assume for deployment'
        required: true
        type: string
      aws_region:
        description: 'AWS region'
        required: true
        type: string
      ecr_repository:
        description: 'ECR repository name'
        required: true
        type: string
      build_context:
        description: 'Docker build context directory'
        required: true
        type: string

jobs:
  push_image:
    runs-on: ubuntu-24.04

    environment: ${{ inputs.github_environment }}

    outputs:
      image_tag: ${{ steps.build_push.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v6

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ inputs.aws_iam_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build_push
        env:
          IMAGE: ${{ steps.ecr_login.outputs.registry }}/${{ inputs.ecr_repository }}:${{ inputs.commit_sha }}
        run: |
          docker build --tag "$IMAGE" ${{ inputs.build_context }}
          docker push "$IMAGE"
          echo "image_tag=$IMAGE" >> "$GITHUB_OUTPUT"
