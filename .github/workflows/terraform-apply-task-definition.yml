name: Terrafrom apply ECS task definition
run-name: terraformm-apply-ecs-task-definition - ${{ inputs.module }}

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      image_tag:
        description: 'The ECR image tag to deploy'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  plan-production:
    uses: ./.github/workflows/plan.yml
    with:
      environment: production
      github_environment: production
      terraform_plan_file_s3_prefix: s3://cloud-nova-corp-terraform/_tfplan/bananas.rails
      terraform_plan_id: ${{ github.run_id }}
      terraform_version_file: terraform/_config/versions.tf.json
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit

  apply-production:
    needs: plan-production
    uses: ./.github/workflows/apply.yml
    with:
      environment: production
      github_environment: production
      terraform_plan_file_s3_prefix: s3://cloud-nova-corp-terraform/_tfplan/bananas.rails
      terraform_plan_id: ${{ github.run_id }}
      terraform_version_file: terraform/_config/versions.tf.json
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit
